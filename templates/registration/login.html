{% extends 'shared/base.html' %}
{% block title %}Log in · Quizroom{% endblock %}
{% block content %}
<div class="auth-header">
  <div class="brand-mark">Q</div>
  <h1>Welcome to Quizroom</h1>
  <p>Sign in with your account credentials to continue</p>
</div>

<div class="auth-card">
  {% if form.errors %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <div>Invalid username or password. Please verify your details.</div>
    </div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold" for="id_username">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
        <input class="form-control border-start-0 ps-0" type="text" name="username" id="id_username" autocomplete="username" placeholder="Enter your username" required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold" for="id_password">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
        <input class="form-control border-start-0 ps-0" type="password" name="password" id="id_password" autocomplete="current-password" placeholder="Enter your password" required>
      </div>
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">
      <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>
  </form>
</div>
{% endblock %}
